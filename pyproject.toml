[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gnsslab"
version = "0.1.0"
description = "Measure phone GNSS accuracy and Kalman-filter drift during GNSS outages"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gnsslab = "gnsslab.cli:main"

[tool.setuptools]
packages = ["gnsslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
