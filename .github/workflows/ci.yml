name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Lint (poslab)
        run: ruff check poslab tests tools
      - name: Tests (poslab + legacy)
        run: pytest -q --cov=poslab --cov-report=term-missing
      - name: Generate smoke scenarios and plot them
        run: |
          python -m poslab generate --smoke
          python tools/plot_scenario.py open_sky_rtk outage_10s_row
      - name: Run algorithms on smoke scenarios
        run: python -m poslab run --smoke
      - name: Legacy demo run on synthetic data
        run: |
          gnsslab simulate --out "$RUNNER_TEMP/sample"
          gnsslab static open="$RUNNER_TEMP/sample/static_open_sky.txt" urban="$RUNNER_TEMP/sample/static_urban.txt" --out "$RUNNER_TEMP/static"
          gnsslab drive "$RUNNER_TEMP/sample/drive.csv" --out "$RUNNER_TEMP/drive"
