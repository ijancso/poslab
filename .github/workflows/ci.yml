name: CI

# push / pull request: lint, unit tests, smoke scenarios (requirements + baseline
#   regression), coverage gate, smoke report.
# nightly (and manual): every scenario x algorithm, full report.
# Both upload the HTML report and the coverage HTML as artifacts.

on:
  push:
  pull_request:
  schedule:
    - cron: "23 2 * * *"      # nightly, 02:23 UTC
  workflow_dispatch:

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check poslab tests tools
      - name: Unit + smoke scenario tests, coverage >= 85 %
        run: >
          pytest -q -m "not scenario or smoke"
          --cov=poslab --cov-report=term-missing --cov-report=html --cov-fail-under=85
      - name: Legacy demo (earlier experiments still run)
        run: |
          gnsslab simulate --out "$RUNNER_TEMP/sample"
          gnsslab static open="$RUNNER_TEMP/sample/static_open_sky.txt" urban="$RUNNER_TEMP/sample/static_urban.txt" --out "$RUNNER_TEMP/static"
          gnsslab drive "$RUNNER_TEMP/sample/drive.csv" --out "$RUNNER_TEMP/drive"
      - name: Smoke run + report
        if: always() && matrix.python-version == '3.13'
        run: |
          python -m poslab run --smoke
          python -m poslab report
      - name: Upload report and coverage
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            out/report/
            htmlcov/
          if-no-files-found: warn

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: All tests (every scenario x algorithm)
        run: pytest -q --cov=poslab --cov-report=term-missing --cov-report=html
      - name: Full run + report
        if: always()
        run: |
          python -m poslab run --all
          python -m poslab report
      - name: Upload report and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: |
            out/report/
            htmlcov/
          if-no-files-found: warn
